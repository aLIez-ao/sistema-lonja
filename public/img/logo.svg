<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Degradado vibrante moderno -->
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#DD2476" />
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#DD2476" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Isotipo (Icono Geométrico Entrelazado) -->
  <g transform="translate(15, 12)" filter="url(#softShadow)">
    <!-- Círculo exterior izquierdo -->
    <circle cx="38" cy="48" r="26" fill="none" stroke="url(#gradBrand)" stroke-width="8" opacity="0.85" />
    
    <!-- Círculo exterior derecho -->
    <circle cx="62" cy="48" r="26" fill="none" stroke="url(#gradBrand)" stroke-width="8" opacity="0.85" />
    
    <!-- Núcleo central intersectado -->
    <circle cx="50" cy="48" r="14" fill="url(#gradBrand)" />
  </g>

  <!-- Logotipo (Texto) -->
  <g transform="translate(135, 72)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="38" font-weight="700" fill="#1E293B" letter-spacing="2">
      LONJA<tspan font-weight="300" fill="#64748B">VERACRUZ</tspan>
    </text>
  </g>
</svg>